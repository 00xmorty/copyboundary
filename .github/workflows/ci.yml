name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile copyboundary
      - run: python -m unittest discover -s tests -v
      - name: Real CLI smoke
        shell: bash
        run: |
          mkdir -p demo/project
          printf 'example\n' > demo/outside.txt
          ln -s ../outside.txt demo/project/link
          set +e
          python copyboundary demo/project --json > report.json
          code=$?
          set -e
          test "$code" = 1
          python -c 'import json; r=json.load(open("report.json")); assert r["status"] == "REVIEW"; assert r["findings"][0]["scope"] == "external"'
